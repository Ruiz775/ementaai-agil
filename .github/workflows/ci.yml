name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verificar:
    name: lint-e-testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pyyaml

      - name: Lint dos templates (YAML válido e campos obrigatórios)
        run: python scripts/verificar_templates.py

      - name: Testes
        run: python -m unittest discover -s tests -v
